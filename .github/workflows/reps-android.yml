# Builds an installable Android APK on GitHub's servers, so no computer is needed.
# Run it from the repo's Actions tab ("Run workflow"), or just push a change under reps/app/.
# The newest APK is attached to the "Reps (latest build)" release, and to the finished run's "Artifacts".
name: Reps - Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['reps/app/**', '.github/workflows/reps-android.yml']

permissions:
  contents: write  # lets the job attach the APK to a release

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: reps/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: reps/app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      # Generates the native android/ project from app.json.
      - run: npx expo prebuild --platform android --no-install
      # The generated project signs release builds with its bundled debug key. That is fine for
      # installing on your own phone; use Expo's build service (eas.json) for a Play Store release.
      - run: ./gradlew assembleRelease --no-daemon
        working-directory: reps/app/android
      - uses: actions/upload-artifact@v4
        with:
          name: Reps-apk
          path: reps/app/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      # A release gives a plain download link that works from a phone browser.
      - name: Attach the APK to the "reps-latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/Reps.apk"
          gh release view reps-latest >/dev/null 2>&1 || gh release create reps-latest --target "$GITHUB_SHA" --title "Reps (latest build)" --notes "The most recent Reps build for Android. Download Reps.apk and open it on your phone."
          gh release upload reps-latest "$RUNNER_TEMP/Reps.apk" --clobber
