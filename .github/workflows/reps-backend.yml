name: Reps - Backend (Cloudflare)

# Deploys the Reps server (sync + the Reps coach connector) to Cloudflare Workers.
# Needs two repository secrets: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
# Optional: REPS_ADMIN_SECRET (lets you create more users through /admin/users).
# Until the secrets exist this job says so and finishes without failing.

on:
  push:
    branches: [main]
    paths:
      - 'reps/backend/**'
      - '.github/workflows/reps-backend.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reps/backend
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      REPS_ADMIN_SECRET: ${{ secrets.REPS_ADMIN_SECRET }}
    steps:
      - name: Check for Cloudflare secrets
        id: ready
        working-directory: .
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "Not deployed: add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets to this repository, then re-run this workflow." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/checkout@v4
        if: steps.ready.outputs.ok == 'true'
      - uses: actions/setup-node@v4
        if: steps.ready.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: reps/backend/package-lock.json
      - run: npm ci
        if: steps.ready.outputs.ok == 'true'
      - run: npx tsc --noEmit
        if: steps.ready.outputs.ok == 'true'
      # Every statement in schema.sql is "IF NOT EXISTS", so this is safe to run on every deploy.
      - name: Create missing tables
        if: steps.ready.outputs.ok == 'true'
        run: npx wrangler d1 execute forgelift --remote --file=schema.sql --yes
      - name: Deploy the Worker
        if: steps.ready.outputs.ok == 'true'
        run: |
          npx wrangler deploy | tee deploy.log
          url="$(grep -o 'https://[a-zA-Z0-9.-]*workers.dev' deploy.log | head -1)"
          echo "Deployed. Server address for the Reps app: ${url:-see the log above}" >> "$GITHUB_STEP_SUMMARY"
      - name: Set the admin secret
        if: steps.ready.outputs.ok == 'true' && env.REPS_ADMIN_SECRET != ''
        run: printf '%s' "$REPS_ADMIN_SECRET" | npx wrangler secret put ADMIN_SECRET
